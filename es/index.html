<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Charlie Pixelz — Portafolio: ilustración, motion, web e IA</title>
    <meta
      name="description"
      content="Portafolio de Charlie Pixelz: ilustración, diseño audiovisual, diseño web y proyectos con IA en una experiencia cyberpunk interactiva."
    />
    <link rel="alternate" hreflang="es" href="https://charlie-pixelz.github.io/portfolio/es/" />
    <link rel="alternate" hreflang="en" href="https://charlie-pixelz.github.io/portfolio/en/" />
    <link rel="alternate" hreflang="x-default" href="https://charlie-pixelz.github.io/portfolio/" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_CL" />
    <meta property="og:title" content="Charlie Pixelz — Portafolio: ilustración, motion, web e IA" />
    <meta
      property="og:description"
      content="Portafolio de Charlie Pixelz: ilustración, diseño audiovisual, diseño web y proyectos con IA en una experiencia cyberpunk interactiva."
    />
    <meta property="og:url" content="https://charlie-pixelz.github.io/portfolio/es/" />
    <meta property="og:image" content="https://charlie-pixelz.github.io/portfolio/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- CSS como <link> (no importado desde main.js): bloquea el primer pintado, así el documento
         nunca se ve un instante en HTML crudo sin estilo (FOUC al cambiar de idioma, 31/7) -->
    <link rel="stylesheet" href="/src/styles/tokens.css" />
    <link rel="stylesheet" href="/src/styles/base.css" />
    <script type="module" src="/src/main.js"></script>
  </head>
  <body class="scene">
    <main class="hero" id="hero">
      <nav class="neon-nav" aria-label="Navegación">
        <a class="sign violeta" style="--ry: 26deg; left: 5.9%; top: 15.7%; width: 11.2%; height: 43.6%" href="#" aria-current="page" aria-label="Inicio"><span class="label"><i>IN</i><i>IC</i><i>IO</i></span></a>
        <a class="sign magenta" data-route="projects" style="--ry: 16deg; left: 26.6%; top: 3.8%; width: 11.1%; height: 32%" href="proyectos/" aria-label="Proyectos"><span class="label"><i>PRO</i><i>YEC</i><i>TOS</i></span></a>
        <a class="sign violeta" data-route="bio" style="--ry: -16deg; left: 58.8%; top: 3%; width: 13.4%; height: 29.3%" href="biografia/" aria-label="Biografía"><span class="label"><i>BIO</i><i>GRA</i><i>FÍA</i></span></a>
        <a class="sign magenta" data-route="contacto" style="--ry: -26deg; left: 78.7%; top: 17.9%; width: 13.4%; height: 41.4%" href="contacto/" aria-label="Contacto"><span class="label"><i>CON</i><i>TAC</i><i>TO</i></span></a>
      </nav>
      <h1 class="brand">
        <span class="brand__charlie">Charlie</span><span class="brand__pixelz">PIXELZ</span>
      </h1>
    </main>
    <section class="room" hidden aria-label="Proyectos">
      <div class="room__frame">
        <a class="screen" data-cat="ilustracion" href="#" aria-label="Ilustraciones" data-quad="1.87,0.00 100.00,20.90 97.55,100.00 0.00,96.87" style="left: 9.74%; top: 14.81%; width: 24.93%; height: 30.51%; clip-path: polygon(1.87% 0.00%, 100.00% 20.90%, 97.55% 100.00%, 0.00% 96.87%)"><span class="screen__plane"><span class="screen__label">Ilustraciones</span></span></a>
        <a class="screen" data-cat="motion" href="#" aria-label="Diseño Audiovisual" data-quad="0.00,0.00 99.53,0.21 100.00,84.32 0.71,100.00" style="left: 9.78%; top: 47.55%; width: 24.51%; height: 29.09%; clip-path: polygon(0.00% 0.00%, 99.53% 0.21%, 100.00% 84.32%, 0.71% 100.00%)"><span class="screen__plane"><span class="screen__label">Audiovisual</span></span></a>
        <a class="screen" data-cat="web" href="#" aria-label="Diseño Web" data-quad="0.00,25.63 95.93,0.00 100.00,91.29 5.41,100.00" style="left: 65.42%; top: 6.88%; width: 26.28%; height: 32.77%; clip-path: polygon(0.00% 25.63%, 95.93% 0.00%, 100.00% 91.29%, 5.41% 100.00%)"><span class="screen__plane"><span class="screen__label">Diseño Web</span></span></a>
        <a class="screen" data-cat="ia" href="#" aria-label="Proyectos con IA" data-quad="0.00,0.72 98.90,0.00 100.00,100.00 0.50,83.11" style="left: 65.86%; top: 46.77%; width: 24.32%; height: 28.32%; clip-path: polygon(0.00% 0.72%, 98.90% 0.00%, 100.00% 100.00%, 0.50% 83.11%)"><span class="screen__plane"><span class="screen__label">Proyectos con IA</span></span></a>
        <a class="screen screen--central" data-route="home" href="#" aria-label="Volver a Inicio" style="left: 35.59%; top: 37.72%; width: 29.12%; height: 29.16%; clip-path: polygon(0.14% 0.00%, 100.00% 0.45%, 99.11% 98.99%, 0.00% 100.00%)"><span class="screen__plane"></span></a>
      </div>
    </section>
    <!-- Mobile (ADENDUM §3): sala de 2 pantallas, solo de TRÁNSITO — la vertical es el destino
         del zoom-in, la horizontal es ambiental (sin contenido, ninguna es clicable). El zoom
         hacia la vertical desemboca en .projects-menu (misma imagen de fondo, ya en pantalla
         completa). -->
    <section class="room-mobile" hidden aria-label="Proyectos">
      <div class="room-mobile__frame">
        <div class="screen-m screen-m--vertical" aria-hidden="true">
          <!-- placeholder del MENÚ de categorías: reusa los MISMOS elementos que el menú real
               (.projects-menu__cat.os-frame) para que el zoom-in no cambie de estética, solo de
               escala (pedido de Charlie 31/7, "no podemos ocupar el mismo?"). Textos por JS. -->
          <nav class="projects-menu__cats">
            <div class="projects-menu__cat os-frame"><span></span></div>
            <div class="projects-menu__cat os-frame"><span></span></div>
            <div class="projects-menu__cat os-frame"><span></span></div>
            <div class="projects-menu__cat os-frame"><span></span></div>
          </nav>
        </div>
        <div class="screen-m screen-m--horizontal" aria-hidden="true"></div>
      </div>
    </section>
    <section class="projects-menu" hidden aria-label="Proyectos">
      <nav class="projects-menu__cats" aria-label="Categorías">
        <button class="projects-menu__cat os-frame" type="button" data-cat="ilustracion"><span></span></button>
        <button class="projects-menu__cat os-frame" type="button" data-cat="motion"><span></span></button>
        <button class="projects-menu__cat os-frame" type="button" data-cat="web"><span></span></button>
        <button class="projects-menu__cat os-frame" type="button" data-cat="ia"><span></span></button>
      </nav>
      <div class="projects-menu__crumb">
        <button class="projects-menu__back" data-route="home" aria-label="Volver a Inicio">‹ Inicio</button>
        <span class="projects-menu__name">Proyectos</span>
      </div>
    </section>
    <section class="category" hidden aria-label="Categoría">
      <div class="cat__stage">
        <div class="cat__canvas"></div>
        <div class="cat__luces" aria-hidden="true"></div>
        <button class="cat__arrow cat__arrow--prev cat__reveal" aria-label="Obra anterior"></button>
        <button class="cat__arrow cat__arrow--next cat__reveal" aria-label="Obra siguiente"></button>
        <div class="cat__info os-frame cat__reveal">
          <div class="cat__meta"><h2 class="cat__title"></h2><span class="cat__counter"></span></div>
          <p class="cat__desc"></p>
          <ul class="cat__tags"></ul>
        </div>
      </div>
      <div class="cat__crumb">
        <button class="cat__back cat__reveal" data-route="projects" aria-label="Volver a Proyectos">‹ Proyectos</button>
        <span class="cat__name"></span>
      </div>
    </section>
    <section class="bio" hidden aria-label="Biografía">
      <div class="bio__scene">
        <svg class="bio__wires" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"></svg>
        <!-- Mobile: aros verdes sobre el esqueleto — tocar uno activa esa caja (una a la vez). -->
        <div class="bio__rings">
          <button class="bio__ring" type="button" data-anchor="tools" style="left: 35%; top: 43%" aria-label="Herramientas"></button>
          <button class="bio__ring" type="button" data-anchor="about" style="left: 30%; top: 64%" aria-label="¿Quién es Charlie?"></button>
          <button class="bio__ring" type="button" data-anchor="skills" style="left: 92%; top: 80%" aria-label="Habilidades"></button>
        </div>
      </div>
      <!-- Las cajas van FUERA de .bio__scene a propósito: la escena está bloqueada al aspecto de
           la radiografía (2400/1465) y queda apaisada con ~10% de espacio muerto a cada lado. Si
           las cajas vivieran dentro, jamás podrían usar ese margen (por eso "no se movían"). Aquí
           se posicionan respecto al viewport y sí llegan a los bordes. -->
      <div class="bio__side bio__side--left">
        <article class="bio__box os-frame bio__box--about" data-anchor="about">
          <h2 class="bio__title"></h2>
          <p class="bio__text"></p>
        </article>
      </div>
      <div class="bio__side bio__side--right">
        <aside class="bio__box os-frame bio__box--tools" data-anchor="tools">
          <h3 class="bio__box-title"></h3>
          <ul class="bio__tools"></ul>
        </aside>
        <aside class="bio__box os-frame bio__box--skills" data-anchor="skills">
          <h3 class="bio__box-title"></h3>
          <ul class="bio__skills"></ul>
        </aside>
      </div>
      <div class="bio__crumb">
        <button class="bio__back" data-route="home" aria-label="Volver a Inicio">‹ Inicio</button>
        <span class="bio__name">Biografía</span>
      </div>
    </section>
    <section class="contacto" hidden aria-label="Contacto">
      <video class="contacto__video" muted loop playsinline preload="none" aria-hidden="true"></video>
      <div class="contacto__crt" aria-hidden="true"></div>
      <div class="contacto__glitch" aria-hidden="true"></div>
      <div class="contacto__panel os-frame">
        <h2 class="contacto__tagline"></h2>
        <ul class="contacto__links"></ul>
      </div>
      <div class="contacto__crumb">
        <button class="contacto__back" data-route="home" aria-label="Volver a Inicio">‹ Inicio</button>
        <span class="contacto__name">Contacto</span>
      </div>
    </section>
    <nav class="pipboy" aria-label="Menú">
      <button class="pipboy__toggle" type="button" aria-expanded="false" aria-controls="pipboy-panel" aria-label="Abrir menú"></button>
      <div class="pipboy__panel os-frame" id="pipboy-panel" role="menu" aria-hidden="true">
        <p class="pipboy__title">MENÚ</p>
        <ul class="pipboy__nav">
          <li role="none"><a class="pipboy__item" role="menuitem" data-route="home" href="/portfolio/es/">Inicio</a></li>
          <li role="none"><a class="pipboy__item" role="menuitem" data-route="projects" href="/portfolio/es/proyectos/">Proyectos</a></li>
          <li role="none"><a class="pipboy__item" role="menuitem" data-route="bio" href="/portfolio/es/biografia/">Biografía</a></li>
          <li role="none"><a class="pipboy__item" role="menuitem" data-route="contacto" href="/portfolio/es/contacto/">Contacto</a></li>
        </ul>
        <div class="pipboy__lang" aria-label="Idioma">
          <a href="/portfolio/es/" data-lang="es" aria-current="true">ESP</a>
          <a href="/portfolio/en/" data-lang="en">ENG</a>
        </div>
      </div>
    </nav>
    <div class="crt" aria-hidden="true"></div>
  </body>
</html>
