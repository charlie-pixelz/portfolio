<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Charlie Pixelz — Portfolio: Illustration, Motion, Web &amp; AI</title>
    <meta
      name="description"
      content="Charlie Pixelz's portfolio: illustration, motion design, web design and AI projects inside an interactive cyberpunk experience."
    />
    <link rel="alternate" hreflang="es" href="https://charliepixelz.design/es/" />
    <link rel="alternate" hreflang="en" href="https://charliepixelz.design/en/" />
    <link rel="alternate" hreflang="x-default" href="https://charliepixelz.design/" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:title" content="Charlie Pixelz — Portfolio: Illustration, Motion, Web &amp; AI" />
    <meta
      property="og:description"
      content="Charlie Pixelz's portfolio: illustration, motion design, web design and AI projects inside an interactive cyberpunk experience."
    />
    <meta property="og:url" content="https://charliepixelz.design/en/" />
    <meta property="og:image" content="https://charliepixelz.design/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- GoatCounter (F1, ratificado 20/7): analytics sin cookies. no_onload=true porque el sitio
         es un mini-router client-side (History API) — el conteo automático de count.js solo vería
         la carga inicial; router.js dispara el conteo manual en cada cambio de vista (ver setState). -->
    <script
      data-goatcounter="https://charliepixelz.goatcounter.com/count"
      data-goatcounter-settings='{"no_onload": true}'
      async
      src="//gc.zgo.at/count.js"
    ></script>
    <!-- CSS como <link> (no importado desde main.js): bloquea el primer pintado, así el documento
         nunca se ve un instante en HTML crudo sin estilo (FOUC al cambiar de idioma, 31/7) -->
    <link rel="stylesheet" href="/src/styles/tokens.css" />
    <link rel="stylesheet" href="/src/styles/base.css" />
    <script type="module" src="/src/main.js"></script>
  </head>
  <body class="scene">
    <main class="hero" id="hero">
      <nav class="neon-nav" aria-label="Navigation">
        <a class="sign violeta" style="--ry: 26deg; left: 5.9%; top: 15.7%; width: 11.2%; height: 43.6%" href="#" aria-current="page" aria-label="Home"><span class="label"><i>H</i><i>O</i><i>M</i><i>E</i></span></a>
        <a class="sign magenta" data-route="projects" style="--ry: 16deg; left: 26.6%; top: 3.8%; width: 11.1%; height: 32%" href="projects/" aria-label="Projects"><span class="label"><i>PRO</i><i>JEC</i><i>TS</i></span></a>
        <a class="sign violeta" data-route="bio" style="--ry: -16deg; left: 58.8%; top: 3%; width: 13.4%; height: 29.3%" href="biography/" aria-label="Biography"><span class="label"><i>BIO</i><i>GRA</i><i>PHY</i></span></a>
        <a class="sign magenta" data-route="contacto" style="--ry: -26deg; left: 78.7%; top: 17.9%; width: 13.4%; height: 41.4%" href="contact/" aria-label="Contact me"><span class="label"><i>CON</i><i>TACT</i><i>ME</i></span></a>
      </nav>
      <h1 class="brand">
        <span class="brand__charlie">Charlie</span><span class="brand__pixelz">PIXELZ</span>
      </h1>
    </main>
    <section class="room" hidden aria-label="Projects">
      <div class="room__frame">
        <a class="screen" data-cat="ilustracion" href="#" aria-label="Illustrations" data-quad="1.87,0.00 100.00,20.90 97.55,100.00 0.00,96.87" style="left: 9.74%; top: 14.81%; width: 24.93%; height: 30.51%; clip-path: polygon(1.87% 0.00%, 100.00% 20.90%, 97.55% 100.00%, 0.00% 96.87%)"><span class="screen__plane"><span class="screen__label">Illustrations</span></span></a>
        <a class="screen" data-cat="motion" href="#" aria-label="Motion Design" data-quad="0.00,0.00 99.53,0.21 100.00,84.32 0.71,100.00" style="left: 9.78%; top: 47.55%; width: 24.51%; height: 29.09%; clip-path: polygon(0.00% 0.00%, 99.53% 0.21%, 100.00% 84.32%, 0.71% 100.00%)"><span class="screen__plane"><span class="screen__label">Motion Design</span></span></a>
        <a class="screen" data-cat="web" href="#" aria-label="Web Design" data-quad="0.00,25.63 95.93,0.00 100.00,91.29 5.41,100.00" style="left: 65.42%; top: 6.88%; width: 26.28%; height: 32.77%; clip-path: polygon(0.00% 25.63%, 95.93% 0.00%, 100.00% 91.29%, 5.41% 100.00%)"><span class="screen__plane"><span class="screen__label">Web Design</span></span></a>
        <a class="screen" data-cat="ia" href="#" aria-label="AI Projects" data-quad="0.00,0.72 98.90,0.00 100.00,100.00 0.50,83.11" style="left: 65.86%; top: 46.77%; width: 24.32%; height: 28.32%; clip-path: polygon(0.00% 0.72%, 98.90% 0.00%, 100.00% 100.00%, 0.50% 83.11%)"><span class="screen__plane"><span class="screen__label">AI Projects</span></span></a>
        <a class="screen screen--central" data-route="home" href="#" aria-label="Back to Home" style="left: 35.59%; top: 37.72%; width: 29.12%; height: 29.16%; clip-path: polygon(0.14% 0.00%, 100.00% 0.45%, 99.11% 98.99%, 0.00% 100.00%)"><span class="screen__plane"></span></a>
      </div>
    </section>
    <!-- Mobile (ADENDUM §3): sala de 2 pantallas, solo de TRÁNSITO — la vertical es el destino
         del zoom-in, la horizontal es ambiental (sin contenido, ninguna es clicable). El zoom
         hacia la vertical desemboca en .projects-menu (misma imagen de fondo, ya en pantalla
         completa). -->
    <section class="room-mobile" hidden aria-label="Projects">
      <div class="room-mobile__frame">
        <div class="screen-m screen-m--vertical" aria-hidden="true">
          <!-- categories-menu placeholder: reuses the SAME elements as the real menu
               (.projects-menu__cat.os-frame) so the zoom-in doesn't change look, only scale
               (Charlie, 31/7 — "can't we use the same one?"). Labels filled in by JS. -->
          <nav class="projects-menu__cats">
            <div class="projects-menu__cat os-frame"><span></span></div>
            <div class="projects-menu__cat os-frame"><span></span></div>
            <div class="projects-menu__cat os-frame"><span></span></div>
            <div class="projects-menu__cat os-frame"><span></span></div>
          </nav>
        </div>
        <div class="screen-m screen-m--horizontal" aria-hidden="true"></div>
      </div>
    </section>
    <section class="projects-menu" hidden aria-label="Projects">
      <nav class="projects-menu__cats" aria-label="Categories">
        <button class="projects-menu__cat os-frame" type="button" data-cat="ilustracion"><span></span></button>
        <button class="projects-menu__cat os-frame" type="button" data-cat="motion"><span></span></button>
        <button class="projects-menu__cat os-frame" type="button" data-cat="web"><span></span></button>
        <button class="projects-menu__cat os-frame" type="button" data-cat="ia"><span></span></button>
      </nav>
      <div class="projects-menu__crumb">
        <button class="projects-menu__back" data-route="home" aria-label="Back to Home">‹ Home</button>
        <span class="projects-menu__name">Projects</span>
      </div>
    </section>
    <section class="category" hidden aria-label="Category">
      <div class="cat__stage">
        <div class="cat__canvas"></div>
        <div class="cat__luces" aria-hidden="true"></div>
        <button class="cat__arrow cat__arrow--prev cat__reveal" aria-label="Previous work"></button>
        <button class="cat__arrow cat__arrow--next cat__reveal" aria-label="Next work"></button>
        <div class="cat__info os-frame cat__reveal">
          <div class="cat__meta"><h2 class="cat__title"></h2><span class="cat__counter"></span></div>
          <p class="cat__desc"></p>
          <ul class="cat__tags"></ul>
        </div>
      </div>
      <div class="cat__crumb">
        <button class="cat__back cat__reveal" data-route="projects" aria-label="Back to Projects">‹ Projects</button>
        <span class="cat__name"></span>
      </div>
    </section>
    <section class="bio" hidden aria-label="Biography">
      <div class="bio__scene">
        <svg class="bio__wires" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"></svg>
        <!-- Mobile: green rings over the skeleton — tapping one activates that box (one at a time). -->
        <div class="bio__rings">
          <button class="bio__ring" type="button" data-anchor="tools" style="left: 35%; top: 43%" aria-label="Tools"></button>
          <button class="bio__ring" type="button" data-anchor="about" style="left: 30%; top: 64%" aria-label="Who is Charlie?"></button>
          <button class="bio__ring" type="button" data-anchor="skills" style="left: 92%; top: 80%" aria-label="Skills"></button>
        </div>
      </div>
      <!-- Las cajas van FUERA de .bio__scene a propósito: la escena está bloqueada al aspecto de
           la radiografía (2400/1465) y queda apaisada con ~10% de espacio muerto a cada lado. Si
           las cajas vivieran dentro, jamás podrían usar ese margen (por eso "no se movían"). Aquí
           se posicionan respecto al viewport y sí llegan a los bordes. -->
      <div class="bio__side bio__side--left">
        <article class="bio__box os-frame bio__box--about" data-anchor="about">
          <h2 class="bio__title"></h2>
          <p class="bio__text"></p>
        </article>
      </div>
      <div class="bio__side bio__side--right">
        <aside class="bio__box os-frame bio__box--tools" data-anchor="tools">
          <h3 class="bio__box-title"></h3>
          <ul class="bio__tools"></ul>
        </aside>
        <aside class="bio__box os-frame bio__box--skills" data-anchor="skills">
          <h3 class="bio__box-title"></h3>
          <ul class="bio__skills"></ul>
        </aside>
      </div>
      <div class="bio__crumb">
        <button class="bio__back" data-route="home" aria-label="Back to Home">‹ Home</button>
        <span class="bio__name">Biography</span>
      </div>
    </section>
    <section class="contacto" hidden aria-label="Contact">
      <video class="contacto__video" muted loop playsinline preload="none" aria-hidden="true"></video>
      <div class="contacto__crt" aria-hidden="true"></div>
      <div class="contacto__glitch" aria-hidden="true"></div>
      <div class="contacto__panel os-frame">
        <h2 class="contacto__tagline"></h2>
        <ul class="contacto__links"></ul>
      </div>
      <div class="contacto__crumb">
        <button class="contacto__back" data-route="home" aria-label="Back to Home">‹ Home</button>
        <span class="contacto__name">Contact</span>
      </div>
    </section>
    <nav class="pipboy" aria-label="Menu">
      <button class="pipboy__toggle" type="button" aria-expanded="false" aria-controls="pipboy-panel" aria-label="Open menu"></button>
      <div class="pipboy__panel os-frame" id="pipboy-panel" role="menu" aria-hidden="true">
        <p class="pipboy__title">MENU</p>
        <ul class="pipboy__nav">
          <li role="none"><a class="pipboy__item" role="menuitem" data-route="home" href="/en/">Home</a></li>
          <li role="none"><a class="pipboy__item" role="menuitem" data-route="projects" href="/en/projects/">Projects</a></li>
          <li role="none"><a class="pipboy__item" role="menuitem" data-route="bio" href="/en/biography/">Biography</a></li>
          <li role="none"><a class="pipboy__item" role="menuitem" data-route="contacto" href="/en/contact/">Contact</a></li>
        </ul>
        <div class="pipboy__lang" aria-label="Language">
          <a href="/es/" data-lang="es">ESP</a>
          <a href="/en/" data-lang="en" aria-current="true">ENG</a>
        </div>
      </div>
    </nav>
    <div class="crt" aria-hidden="true"></div>
  </body>
</html>
