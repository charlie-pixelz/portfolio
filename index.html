<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Charlie Pixelz — Portafolio</title>
    <meta
      name="description"
      content="Portafolio de Charlie Pixelz: ilustración, diseño audiovisual, diseño web y proyectos con IA."
    />
    <link rel="alternate" hreflang="es" href="https://charlie-pixelz.github.io/portfolio/es/" />
    <link rel="alternate" hreflang="en" href="https://charlie-pixelz.github.io/portfolio/en/" />
    <link rel="alternate" hreflang="x-default" href="https://charlie-pixelz.github.io/portfolio/" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Charlie Pixelz — Portafolio" />
    <meta
      property="og:description"
      content="Portafolio de Charlie Pixelz: ilustración, diseño audiovisual, diseño web y proyectos con IA."
    />
    <meta property="og:url" content="https://charlie-pixelz.github.io/portfolio/" />
    <meta property="og:image" content="https://charlie-pixelz.github.io/portfolio/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- CSS como <link> (no importado desde main.js): bloquea el primer pintado, así el documento
         nunca se ve un instante en HTML crudo sin estilo (FOUC al cambiar de idioma, 31/7) -->
    <link rel="stylesheet" href="/src/styles/tokens.css" />
    <link rel="stylesheet" href="/src/styles/base.css" />
    <script type="module" src="/src/main.js"></script>
  </head>
  <body>
    <main class="preloader">
      <div class="lang-select" id="langSelect" hidden>
        <p class="lang-prompt">Selecciona idioma · Choose language</p>
        <nav class="lang lang--cream" aria-label="Selector de idioma / Language selector">
          <a href="es/" data-lang="es">ESP</a>
          <a href="en/" data-lang="en">ENG</a>
        </nav>
      </div>
      <div class="preloader__lockup">
        <p
          class="pct"
          id="pct"
          role="progressbar"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-valuenow="0"
          aria-label="Cargando / Loading"
        >
          0%
        </p>
        <h1 class="brand brand--preloader">
          <span class="brand__charlie">Charlie</span><span class="brand__pixelz">PIXELZ</span>
        </h1>
        <p class="tagline tagline--cream">
          Diseño, ilustración, motion y desarrollo web potenciados con IA.
        </p>
      </div>
    </main>
    <div class="crt" aria-hidden="true"></div>
  </body>
</html>
